    background: #0d1f0d;

// ─────────────────────────────────────────────────────────────
//  TERMINAL ENGINE
// ─────────────────────────────────────────────────────────────
const output = document.getElementById('term-output');
const input  = document.getElementById('term-input');
let history = [];
let histIdx = -1;

function write(text, cls = '') {
  const lines = text.split('\n');
  lines.forEach(l => {
    const span = document.createElement('span');
    span.className = 'line' + (cls ? ' ' + cls : '');
    span.textContent = l;
    output.appendChild(span);
    output.appendChild(document.createTextNode('\n'));
  });
  output.scrollTop = output.scrollHeight;
}

function writePrompt(cmd) {
  write('l1nuxkid@terminal:~$ ' + cmd, 'prompt-line');
}

function runCommand(raw) {
  const cmd = raw.trim();
  if (!cmd) return;
  history.unshift(cmd);
  histIdx = -1;
  writePrompt(cmd);
  const parts = cmd.split(/\s+/);
  const base  = parts[0].toLowerCase();
  const arg   = parts.slice(1).join(' ');

  switch (base) {
    case 'help':
      write(HELP_TEXT, 'bright');
      break;
    case 'ls':
      write('');
      write('  drwxr-xr-x  .', 'dim');
      write('  drwxr-xr-x  ..', 'dim');
      Object.keys(FS).forEach(f => {
        write('  -rw-r--r--  ' + f, 'cyan');
      });
      write('');
      break;
    case 'cat':
      if (!arg) { write('  usage: cat <filename>', 'yellow'); break; }
      if (FS[arg]) {
        write(FS[arg], 'bright');
      } else {
        write('  cat: ' + arg + ': No such file or directory', 'red');
        write('  Try: ls', 'dim');
      }
      break;
    case 'pwd':
      write('  /home/l1nuxkid', 'bright');
      break;
    case 'whoami':
      write('  l1nuxkid', 'bright');
      write('  Harsh Vala — Offensive Security Professional', 'dim');
      break;
    case 'uname':
      write('  l1nuxkid-terminal 1.0.0 OSCP+ Pro-Hacker GNU/Linux', 'bright');
      break;
    case 'clear':
      output.innerHTML = '';
      write(ASCII_BANNER, 'art');
      break;
    case 'exit':
    case 'quit':
      closeTerminal();
      break;
    case 'open':
    case 'xdg-open':
      handleOpen(arg);
      break;
    default:
      write('  ' + base + ': command not found', 'red');
      write("  type 'help' for available commands", 'dim');
  }
  write('');
}

function handleOpen(url) {

  };
  const target = map[url] || url;
  write('  Opening: ' + target, 'cyan');
  setTimeout(() => window.open(target, '_blank'), 400);
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = input.value;
    input.value = '';
    runCommand(val);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) { histIdx++; input.value = history[histIdx]; }
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) { histIdx--; input.value = history[histIdx]; }
    else { histIdx = -1; input.value = ''; }
  } else if (e.key === 'Tab') {
    e.preventDefault();
    const val = input.value.trim();
    if (val.startsWith('cat ')) {
      const partial = val.slice(4);
      const matches = Object.keys(FS).filter(f => f.startsWith(partial));
      if (matches.length === 1) input.value = 'cat ' + matches[0];
      else if (matches.length > 1) write('  ' + matches.join('  '), 'dim');
    }
  }
});

const bootEl = document.getElementById('boot-text');
let bootDone = false;

function renderBoot() {
  let delay = 200;
  bootLines.forEach((line, i) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.textContent = line.t;
      if (i === bootLines.length - 1) {
        div.innerHTML = line.t + '<span id="boot-cursor"></span>';
      }
      bootEl.appendChild(div);
      requestAnimationFrame(() => div.classList.add('show'));
    }, delay);
    delay += line.d + Math.random() * 30;
  });
  setTimeout(() => {
    bootDone = true;
    document.addEventListener('keydown', skipBoot, { once: true });
    document.getElementById('boot').addEventListener('click', skipBoot, { once: true });
  }, delay);
}

function skipBoot() {
  if (!bootDone) return;
  const boot = document.getElementById('boot');
  boot.style.transition = 'opacity 0.6s';
  boot.style.opacity = '0';
  setTimeout(() => {
    boot.remove();
    launchScene();
  }, 600);
}

function launchScene() {
  document.getElementById('vignette').classList.add('active');
  document.getElementById('scanlines').classList.add('active');

  const container = document.getElementById('canvas-container');
  const W = window.innerWidth, H = window.innerHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.8;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x050705);
  scene.fog = new THREE.FogExp2(0x050705, 0.04);

  const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
  camera.position.set(0, 0.5, 5.5);

  // ── FLOOR ──
  const floorGeo = new THREE.PlaneGeometry(30, 30);
  const floorMat = new THREE.MeshStandardMaterial({
    color: 0x0a0f0a, roughness: 0.9, metalness: 0.1
  });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -2;
  floor.receiveShadow = true;
  scene.add(floor);

  // ── GRID ──
  const grid = new THREE.GridHelper(20, 30, 0x0a2a0a, 0x061406);
  grid.position.y = -2;
  scene.add(grid);

  // ─────────────────────────────────
  //  RETRO COMPUTER MODEL
  // ─────────────────────────────────
  const monitorGroup = new THREE.Group();

  // Monitor outer shell
  const monShell = new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 2.5, 1.4),
    new THREE.MeshStandardMaterial({ color: 0xd4c9a8, roughness: 0.6, metalness: 0.05 })
  );
  monShell.castShadow = true;
  monitorGroup.add(monShell);

  // Monitor bevel top
  const bevelTop = new THREE.Mesh(
    new THREE.BoxGeometry(3.4, 0.12, 1.4),
    new THREE.MeshStandardMaterial({ color: 0xbcb298, roughness: 0.7 })
  );
  bevelTop.position.y = 1.31;
  monitorGroup.add(bevelTop);

  // Screen recess (dark inset)
  const screenRecess = new THREE.Mesh(
    new THREE.BoxGeometry(2.7, 1.95, 0.06),
    new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 1 })
  );
  screenRecess.position.z = 0.71;
  monitorGroup.add(screenRecess);

  // Screen glow plane
  const screenCanvas = document.createElement('canvas');
  screenCanvas.width = 512; screenCanvas.height = 384;
  const ctx = screenCanvas.getContext('2d');
  drawScreenContent(ctx);
  const screenTex = new THREE.CanvasTexture(screenCanvas);

  const screen = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, 1.85),
    new THREE.MeshBasicMaterial({ map: screenTex, color: 0xaaffaa })
  );
  screen.position.z = 0.745;
  monitorGroup.add(screen);

  // Screen tint overlay (reflection feel)
  const screenOverlay = new THREE.Mesh(
    new THREE.PlaneGeometry(2.6, 1.85),
    new THREE.MeshBasicMaterial({
      color: 0x003300, transparent: true, opacity: 0.18
    })
  );
  screenOverlay.position.z = 0.752;
  monitorGroup.add(screenOverlay);

  // Monitor stand neck
  const neckGeo = new THREE.CylinderGeometry(0.14, 0.2, 0.7, 8);
  const neckMat = new THREE.MeshStandardMaterial({ color: 0xbcb298, roughness: 0.65 });
  const neck = new THREE.Mesh(neckGeo, neckMat);
  neck.position.y = -1.6;
  monitorGroup.add(neck);

  // Monitor stand base
  const baseGeo = new THREE.CylinderGeometry(0.72, 0.72, 0.12, 12);
  const base = new THREE.Mesh(baseGeo, neckMat);
  base.position.y = -1.97;
  base.castShadow = true;
  monitorGroup.add(base);

  // Ventilation slots on back/side
  for (let i = 0; i < 5; i++) {
    const slot = new THREE.Mesh(
      new THREE.BoxGeometry(0.3, 0.04, 0.05),
      new THREE.MeshStandardMaterial({ color: 0x998866, roughness: 0.8 })
    );
    slot.position.set(1.62, 0.4 - i * 0.22, 0);
    monitorGroup.add(slot);
  }

  // Power button
  const pwrBtn = new THREE.Mesh(
    new THREE.CylinderGeometry(0.07, 0.07, 0.04, 16),
    new THREE.MeshStandardMaterial({ color: 0x226622, emissive: 0x00aa00, emissiveIntensity: 1.2, roughness: 0.3 })
  );
  pwrBtn.rotation.x = Math.PI / 2;
  pwrBtn.position.set(1.35, -0.85, 0.71);
  monitorGroup.add(pwrBtn);

  // Power LED glow
  const pwrLight = new THREE.PointLight(0x00ff44, 0.4, 0.6);
  pwrLight.position.set(1.35, -0.85, 0.85);
  monitorGroup.add(pwrLight);

  // Screen ambient glow
  const screenLight = new THREE.PointLight(0x22ff44, 0.6, 3);
  screenLight.position.set(0, 0.2, 1.5);
  monitorGroup.add(screenLight);

  monitorGroup.position.set(0, 0.3, 0);
  scene.add(monitorGroup);

  // ── KEYBOARD ──
  const kbGroup = new THREE.Group();
  const kbBase = new THREE.Mesh(
    new THREE.BoxGeometry(3.2, 0.14, 1.0),
    new THREE.MeshStandardMaterial({ color: 0xcec4a2, roughness: 0.65 })
  );
  kbBase.castShadow = true;
  kbGroup.add(kbBase);

  // Keyboard keys grid
  const keyColors = [0xc8bc98, 0xd0c4a0, 0xc4b890];
  for (let row = 0; row < 4; row++) {
    const keysInRow = row === 0 ? 12 : row === 3 ? 8 : 11;
    for (let col = 0; col < keysInRow; col++) {
      const key = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.06, 0.18),
        new THREE.MeshStandardMaterial({ color: keyColors[(row + col) % 3], roughness: 0.7 })
      );
      const totalW = keysInRow * 0.24;
      key.position.set(
        -totalW / 2 + col * 0.24 + 0.12,
        0.1,
        -0.32 + row * 0.22
      );
      kbGroup.add(key);
    }
  }

  kbGroup.position.set(0, -1.93, 1.8);
  kbGroup.rotation.x = -0.08;
  scene.add(kbGroup);

  // ── MOUSE ──
  const mouseBody = new THREE.Mesh(
    new THREE.CapsuleGeometry ? new THREE.CapsuleGeometry(0.1, 0.2, 6, 8)
      : new THREE.CylinderGeometry(0.1, 0.12, 0.32, 12),
    new THREE.MeshStandardMaterial({ color: 0xd4c8a8, roughness: 0.65 })
  );
  mouseBody.position.set(2.1, -1.9, 1.65);
  mouseBody.rotation.x = Math.PI / 2;
  scene.add(mouseBody);

  // ── DESK ──
  const desk = new THREE.Mesh(
    new THREE.BoxGeometry(8, 0.12, 3.5),
    new THREE.MeshStandardMaterial({ color: 0x3a2a18, roughness: 0.85, metalness: 0.02 })
  );
  desk.position.y = -2;
  desk.receiveShadow = true;
  scene.add(desk);

  // Desk legs
  const legMat = new THREE.MeshStandardMaterial({ color: 0x2a1e10, roughness: 0.9 });
  [[-3.4, 0.7], [3.4, 0.7], [-3.4, -0.7], [3.4, -0.7]].forEach(([x, z]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.5, 0.1), legMat);
    leg.position.set(x, -2.8, z);
    scene.add(leg);
  });

  // ── DECORATIVE FLOPPY DISKS ──
  [-2.1, -1.7].forEach((x, i) => {
    const floppy = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.03, 0.42),
      new THREE.MeshStandardMaterial({ color: i === 0 ? 0x111166 : 0x661111, roughness: 0.7 })
    );
    floppy.position.set(x, -1.94, 1.4);
    scene.add(floppy);
  });

  // ── COFFEE CUP ──
  const cupGroup = new THREE.Group();
  const cupBody = new THREE.Mesh(
    new THREE.CylinderGeometry(0.14, 0.11, 0.3, 12),
    new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.5 })
  );
  cupGroup.add(cupBody);
  const cupLiquid = new THREE.Mesh(
    new THREE.CircleGeometry(0.13, 12),
    new THREE.MeshStandardMaterial({ color: 0x3a1a00, roughness: 1 })
  );
  cupLiquid.rotation.x = -Math.PI / 2;
  cupLiquid.position.y = 0.14;
  cupGroup.add(cupLiquid);
  cupGroup.position.set(-2.2, -1.85, 0.8);
  scene.add(cupGroup);

  // ── LIGHTS ──
  scene.add(new THREE.AmbientLight(0x112211, 0.8));

  const keyLight = new THREE.SpotLight(0xffeedd, 0.6, 12, Math.PI / 4, 0.5);
  keyLight.position.set(2, 4, 3);
  keyLight.castShadow = true;
  scene.add(keyLight);

  const fillLight = new THREE.PointLight(0x112233, 0.3, 8);
  fillLight.position.set(-3, 2, -2);
  scene.add(fillLight);

  const screenGlow = new THREE.PointLight(0x00ff44, 0.5, 4);
  screenGlow.position.set(0, 0.5, 2.5);
  scene.add(screenGlow);

  // ── PARTICLES ──
  const partGeo = new THREE.BufferGeometry();
  const partCount = 300;
  const pPos = new Float32Array(partCount * 3);
  for (let i = 0; i < partCount * 3; i++) {
    pPos[i] = (Math.random() - 0.5) * 20;
  }
  partGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const partMat = new THREE.PointsMaterial({
    color: 0x00ff44, size: 0.02, transparent: true, opacity: 0.35
  });
  scene.add(new THREE.Points(partGeo, partMat));

  // ── CAMERA ANIMATION ──
  let camTarget = { x: 0, y: 0.5, z: 5.5 };
  let camPos    = { x: 0, y: 0.5, z: 5.5 };
  let camFocus  = { x: 0, y: 0, z: 0 };
  let phase = 0; // 0=idle orbit, 1=zoom to screen

  // Mouse parallax
  let mx = 0, my = 0;
  document.addEventListener('mousemove', e => {
    mx = (e.clientX / window.innerWidth  - 0.5) * 2;
    my = (e.clientY / window.innerHeight - 0.5) * 2;
  });

  // Click on screen = open terminal
  renderer.domElement.addEventListener('click', e => {
    const mouse = new THREE.Vector2(
      (e.clientX / window.innerWidth) * 2 - 1,
      -(e.clientY / window.innerHeight) * 2 + 1
    );
    const ray = new THREE.Raycaster();
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObject(screen);
    if (hits.length > 0) { openTerminal(); }
  });

  renderer.domElement.style.cursor = 'default';
  renderer.domElement.addEventListener('mousemove', e => {
    const mouse = new THREE.Vector2(
      (e.clientX / window.innerWidth) * 2 - 1,
      -(e.clientY / window.innerHeight) * 2 + 1
    );
    const ray = new THREE.Raycaster();
    ray.setFromCamera(mouse, camera);
    const hits = ray.intersectObject(screen);
    renderer.domElement.style.cursor = hits.length > 0 ? 'pointer' : 'default';
  });

  // Show hint
  const hint = document.getElementById('hint');
  setTimeout(() => {
    hint.textContent = '[ CLICK THE SCREEN TO OPEN TERMINAL ]';
    hint.classList.add('active');
    setTimeout(() => hint.classList.remove('active'), 4000);
  }, 1200);

  // Mobile button
  if ('ontouchstart' in window) {
    document.getElementById('tap-to-open').style.display = 'block';
  }

  // Animate screen content
  let frame = 0;
  function drawScreenContent(ctx) {
    ctx.fillStyle = '#000800';
    ctx.fillRect(0, 0, 512, 384);

    // Scanlines on canvas texture
    for (let y = 0; y < 384; y += 3) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0, y, 512, 1);
    }

    ctx.font = 'bold 14px "Courier New"';
    ctx.fillStyle = '#22cc44';

    const lines = [
      ' _  _',
      '| || |__ _ _ _ ____ |_  \\  / __ _| |__ _',
      '| __ / _` | \'_(_-< | /\\/\\/ / _` | / / _` |',
      '|_||_\\__,_|_| /__/ |_|    \\__,_|_\\_\\__,_|',
      '',
      '  l1nuxkid@terminal:~$ _',
      '',
      '  OSCP+ | Pro Hacker | CTF #13',
    ];

    lines.forEach((line, i) => {
      ctx.fillStyle = i < 4 ? '#229944' : i === 7 ? '#00ff88' : '#33cc44';
      ctx.fillText(line, 12, 40 + i * 18);
    });

    // Blinking cursor sim
    if (Math.floor(frame / 30) % 2 === 0) {
      ctx.fillStyle = '#33ff33';
      ctx.fillRect(200, 148, 8, 14);
    }
  }

  // ── RENDER LOOP ──
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    frame++;
    const t = clock.getElapsedTime();

    // Idle camera orbit
    if (phase === 0) {
      camTarget.x = Math.sin(t * 0.18) * 0.7 + mx * 0.25;
      camTarget.y = 0.5 + Math.sin(t * 0.12) * 0.15 + my * -0.15;
      camTarget.z = 5.5 + Math.sin(t * 0.1) * 0.3;
    }
    camera.position.x += (camTarget.x - camera.position.x) * 0.03;
    camera.position.y += (camTarget.y - camera.position.y) * 0.03;
    camera.position.z += (camTarget.z - camera.position.z) * 0.03;
    camera.lookAt(camFocus.x, camFocus.y + 0.3, camFocus.z);

    // Monitor gentle bob
    monitorGroup.position.y = 0.3 + Math.sin(t * 0.5) * 0.01;

    // Screen flicker (subtle)
    if (frame % 180 === 0) {
      screenGlow.intensity = 0.3 + Math.random() * 0.4;
    }

    // Refresh screen canvas occasionally
    if (frame % 45 === 0) {
      drawScreenContent(ctx);
      screenTex.needsUpdate = true;
    }

    // Particle drift
    const pArr = partGeo.attributes.position.array;
    for (let i = 1; i < pArr.length; i += 3) {
      pArr[i] += 0.002;
      if (pArr[i] > 5) pArr[i] = -5;
    }
    partGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    const W = window.innerWidth, H = window.innerHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
}

// ─────────────────────────────────────────────────────────────
//  OPEN / CLOSE TERMINAL
// ─────────────────────────────────────────────────────────────
let terminalOpen = false;

function openTerminal() {
  if (terminalOpen) return;
  terminalOpen = true;
  const tw = document.getElementById('terminal-window');
  tw.style.display = 'flex';
  output.innerHTML = '';
  write(ASCII_BANNER, 'art');
  write("  Type 'help' to see commands.", 'dim');
  write("  Try: cat about.txt", 'dim');
  write('');
  input.focus();
}

function closeTerminal() {
  terminalOpen = false;
  const tw = document.getElementById('terminal-window');
  tw.style.display = 'none';
}

// Keyboard shortcut: ` or ~ to toggle terminal
document.addEventListener('keydown', e => {
  if (e.key === '`' || e.key === '~') {
    if (terminalOpen) closeTerminal();
    else openTerminal();
  }
  if (e.key === 'Escape' && terminalOpen) closeTerminal();
});

// ─────────────────────────────────────────────────────────────
//  START BOOT
// ─────────────────────────────────────────────────────────────
window.addEventListener('load', renderBoot);
</script>
</body>
</html>
